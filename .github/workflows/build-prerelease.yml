name: Prerelease Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0-alpha.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CNB_REPO_SLUG: wwvo/cnb-rs/cnb-rs

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            use_build_std: true
            toolchain: nightly
            package_linux_deb: true
            package_linux_rpm: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            use_cross: true
            package_linux_deb: true
            package_linux_rpm: true
            linux_deb_arch: arm64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            archive_ext: zip
            setup_mingw: true
            package_windows_msi: true
            windows_msi_arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            msvc_dev_cmd_arch: amd64
            package_windows_msi: true
            windows_msi_arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            msvc_dev_cmd_arch: amd64_arm64
            package_windows_msi: true
            windows_msi_arch: arm64
          - os: ubuntu-latest
            target: aarch64-pc-windows-gnullvm
            archive_ext: zip
            setup_cross_toolchain: true
            experimental: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}
          targets: ${{ matrix.target }}
          components: ${{ matrix.use_build_std && 'rust-src' || '' }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: prerelease-${{ matrix.target }}

      - name: Resolve Cargo host target
        id: host_target
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          echo "target=${host_target}" >> "$GITHUB_OUTPUT"

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Setup MinGW
        if: matrix.setup_mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Add MinGW to PATH
        if: matrix.setup_mingw
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Setup Windows ARM64 gnullvm toolchain
        if: matrix.setup_cross_toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Setup MSVC developer command prompt
        if: matrix.msvc_dev_cmd_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_dev_cmd_arch }}

      - name: Install Linux native packaging dependencies
        if: matrix.package_linux_deb || matrix.package_linux_rpm
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          if [[ -n "${{ matrix.linux_deb_arch }}" ]]; then
            sudo apt-get install -y "crossbuild-essential-${{ matrix.linux_deb_arch }}"
          fi

      - name: Install cargo-deb
        if: matrix.package_linux_deb
        shell: bash
        run: cargo install cargo-deb --locked --target "${{ steps.host_target.outputs.target }}"

      - name: Install cargo-generate-rpm
        if: matrix.package_linux_rpm
        shell: bash
        run: cargo install cargo-generate-rpm --locked --target "${{ steps.host_target.outputs.target }}"

      - name: Setup .NET SDK
        if: matrix.package_windows_msi
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && !matrix.use_cross && !matrix.setup_cross_toolchain
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build binaries (Windows MSVC)
        if: endsWith(matrix.target, '-pc-windows-msvc')
        shell: pwsh
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Build binaries (cross)
        if: matrix.use_cross
        shell: bash
        run: cross build --release --locked --target "${{ matrix.target }}"

      - name: Build binaries (native)
        if: ${{ !endsWith(matrix.target, '-pc-windows-msvc') && !matrix.use_cross && !matrix.setup_cross_toolchain }}
        shell: bash
        run: |
          CARGO_CMD="cargo"
          BUILD_STD_FLAG=""
          if [[ "${{ matrix.use_build_std }}" == "true" ]]; then
            CARGO_CMD="cargo +nightly"
            BUILD_STD_FLAG="-Z build-std=std,panic_abort"
          fi
          $CARGO_CMD build --release --locked --target "${{ matrix.target }}" $BUILD_STD_FLAG

      - name: Build binaries (cross-toolchain)
        if: matrix.setup_cross_toolchain
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Build Windows MSI package
        if: matrix.package_windows_msi
        shell: pwsh
        run: |
          .\packaging\windows\scripts\build-msi.ps1 `
            -Target ${{ matrix.target }} `
            -Architecture ${{ matrix.windows_msi_arch }} `
            -OutputDir target\windows-msi

      - name: Build Linux packaging helper binary
        if: matrix.package_linux_deb || matrix.package_linux_rpm
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${{ matrix.target }}" == "${host_target}" ]]; then
            exit 0
          fi
          cargo build --release --locked --bin cnb-rs --target "${host_target}" --target-dir target/packaging-host

      - name: Compress binary with UPX (Linux only)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/cnb-rs"
          if command -v upx &>/dev/null; then
            upx --best "${binary}" || echo "UPX compression failed, continuing with uncompressed binary"
          else
            # Install UPX
            UPX_VERSION="5.1.1"
            curl -sL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" | tar -xJ --strip-components=1 -C /usr/local/bin "upx-${UPX_VERSION}-amd64_linux/upx"
            upx --best "${binary}" || echo "UPX compression failed, continuing with uncompressed binary"
          fi

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ inputs.version }}"
          asset_base="cnb-rs-${release_tag}-${{ matrix.target }}"
          asset_dir="${asset_base}"
          archive_file=""
          msi_file=""
          deb_file=""
          rpm_file=""

          if [[ "${{ matrix.target }}" == *-windows-* ]]; then
            binary_name="cnb-rs.exe"
          else
            binary_name="cnb-rs"
          fi

          mkdir -p "${asset_dir}"
          cp "target/${{ matrix.target }}/release/${binary_name}" "${asset_dir}/"

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            7z a -tzip -mx=9 "${asset_base}.zip" "${asset_dir}"
            archive_file="${asset_base}.zip"
          else
            archive_file="${asset_base}.tar.gz"
            tar cf - "${asset_dir}" | gzip -9 > "${archive_file}"
          fi

          if [[ "${{ matrix.package_windows_msi }}" == "true" ]]; then
            generated_msi_file="$(find target/windows-msi -maxdepth 1 -type f -name "*-${{ matrix.target }}.msi" | sort | head -n 1)"
            : "${generated_msi_file:?failed to locate generated MSI file}"
            cp "${generated_msi_file}" .
            msi_file="$(basename "${generated_msi_file}")"
          fi

          if [[ "${{ matrix.package_linux_deb }}" == "true" || "${{ matrix.package_linux_rpm }}" == "true" ]]; then
            host_target="$(rustc -vV | sed -n 's/^host: //p')"
            completion_binary_path="target/${{ matrix.target }}/release/cnb-rs"
            if [[ "${{ matrix.target }}" != "${host_target}" ]]; then
              completion_binary_path="target/packaging-host/${host_target}/release/cnb-rs"
            fi
            bash packaging/linux/scripts/generate-completions.sh --binary-path "${completion_binary_path}"
          fi

          if [[ "${{ matrix.package_linux_deb }}" == "true" ]]; then
            cargo deb --no-build --no-strip --target "${{ matrix.target }}"
            generated_deb_file=""
            for candidate_dir in "target/${{ matrix.target }}/debian" "target/debian"; do
              if [[ -d "${candidate_dir}" ]]; then
                generated_deb_file="$(find "${candidate_dir}" -maxdepth 1 -type f -name '*.deb' | head -n 1)"
              fi
              if [[ -n "${generated_deb_file}" ]]; then break; fi
            done
            : "${generated_deb_file:?failed to locate generated deb file}"
            cp "${generated_deb_file}" .
            deb_file="$(basename "${generated_deb_file}")"
          fi

          if [[ "${{ matrix.package_linux_rpm }}" == "true" ]]; then
            # RPM version format does not support '-' (e.g., 1.0.0-alpha.11 is invalid)
            # Skip RPM packaging for prerelease versions
            if [[ "${release_tag}" == *-* ]]; then
              echo "SKIP: RPM packaging not supported for prerelease version ${release_tag}"
            else
              cargo generate-rpm --target "${{ matrix.target }}"
              generated_rpm_file=""
              for candidate_dir in "target/${{ matrix.target }}/generate-rpm" "target/generate-rpm"; do
                if [[ -d "${candidate_dir}" ]]; then
                  generated_rpm_file="$(find "${candidate_dir}" -maxdepth 1 -type f -name '*.rpm' | head -n 1)"
                fi
                if [[ -n "${generated_rpm_file}" ]]; then break; fi
              done
              : "${generated_rpm_file:?failed to locate generated rpm file}"
              cp "${generated_rpm_file}" .
              rpm_file="$(basename "${generated_rpm_file}")"
            fi
          fi

          printf 'archive_file=%s\n' "${archive_file}" >> "$GITHUB_OUTPUT"
          printf 'msi_file=%s\n' "${msi_file}" >> "$GITHUB_OUTPUT"
          printf 'deb_file=%s\n' "${deb_file}" >> "$GITHUB_OUTPUT"
          printf 'rpm_file=%s\n' "${rpm_file}" >> "$GITHUB_OUTPUT"

      - name: Upload build archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.archive_file }}
          path: ${{ steps.package.outputs.archive_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows MSIX input artifact
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'aarch64-pc-windows-msvc' }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-msix-input-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cnb-rs.exe
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows MSI artifact
        if: ${{ steps.package.outputs.msi_file != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.msi_file }}
          path: ${{ steps.package.outputs.msi_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux DEB artifact
        if: ${{ steps.package.outputs.deb_file != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.deb_file }}
          path: ${{ steps.package.outputs.deb_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux RPM artifact
        if: ${{ steps.package.outputs.rpm_file != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.rpm_file }}
          path: ${{ steps.package.outputs.rpm_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  build-msix:
    name: Build Windows MSIX/MSIXBUNDLE
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-latest
    outputs:
      msix_enabled: ${{ steps.signing_mode.outputs.enabled }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      msix_version: ${{ steps.metadata.outputs.msix_version }}
    env:
      WINDOWS_MSIX_PFX_BASE64: ${{ secrets.WINDOWS_MSIX_PFX_BASE64 }}
      WINDOWS_MSIX_PFX_PASSWORD: ${{ secrets.WINDOWS_MSIX_PFX_PASSWORD }}
      WINDOWS_MSIX_IDENTITY_NAME: ${{ vars.WINDOWS_MSIX_IDENTITY_NAME }}
      WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME }}
      WINDOWS_MSIX_DISPLAY_NAME: ${{ vars.WINDOWS_MSIX_DISPLAY_NAME }}
      WINDOWS_MSIX_DESCRIPTION: ${{ vars.WINDOWS_MSIX_DESCRIPTION }}
      WINDOWS_MSIX_EXECUTION_ALIAS: ${{ vars.WINDOWS_MSIX_EXECUTION_ALIAS }}

    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Resolve MSIX signing mode
        id: signing_mode
        shell: pwsh
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PFX_PASSWORD)

          if ($hasPfx -and $hasPassword) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "MSIX signing secrets detected; Windows MSIX/MSIXBUNDLE build is enabled."
            exit 0
          }

          if (-not $hasPfx -and -not $hasPassword) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning "MSIX signing secrets not configured; skipping Windows MSIX/MSIXBUNDLE build."
            exit 0
          }

          throw "Incomplete MSIX signing configuration"

      - name: Setup Rust toolchain
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msix-prerelease

      - name: Setup .NET SDK
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve MSIX release metadata
        id: metadata
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart("v")
          $semverMatch = [regex]::Match($version, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)')
          if (-not $semverMatch.Success) {
            throw "Unsupported version for MSIX packaging: $version"
          }
          $msixVersion = "{0}.{1}.{2}.0" -f $semverMatch.Groups["major"].Value, $semverMatch.Groups["minor"].Value, $semverMatch.Groups["patch"].Value
          $identityName = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_IDENTITY_NAME)) { "wwvo.cnb-rs" } else { $env:WINDOWS_MSIX_IDENTITY_NAME }
          $publisherDisplayName = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME)) { "wwvo" } else { $env:WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME }
          $displayName = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_DISPLAY_NAME)) { "cnb-rs" } else { $env:WINDOWS_MSIX_DISPLAY_NAME }
          $description = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_DESCRIPTION)) { "Unofficial CNB command-line tool built with Rust" } else { $env:WINDOWS_MSIX_DESCRIPTION }
          $executionAlias = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_MSIX_EXECUTION_ALIAS)) { "cnb-rs.exe" } else { $env:WINDOWS_MSIX_EXECUTION_ALIAS }
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "msix_version=$msixVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "identity_name=$identityName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publisher_display_name=$publisherDisplayName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "display_name=$displayName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "description=$description" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "execution_alias=$executionAlias" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download x64 MSIX input artifact
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: windows-msix-input-x86_64-pc-windows-msvc
          path: target/windows-msix/input/x64

      - name: Download arm64 MSIX input artifact
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: windows-msix-input-aarch64-pc-windows-msvc
          path: target/windows-msix/input/arm64

      - name: Install msixbundle-cli
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        shell: pwsh
        run: cargo install msixbundle-cli --locked --version 1.1.4 --root target/tools/msixbundle-cli

      - name: Materialize signing certificate
        id: certificate
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $certDir = Join-Path $PWD "target/windows-msix/cert"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $pfxPath = Join-Path $certDir "release-signing.pfx"
          $certificateAssetName = "cnb-rs-v${{ steps.metadata.outputs.release_version }}-windows-msvc-signing-cert.cer"
          $certificatePath = Join-Path $certDir $certificateAssetName
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_MSIX_PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_MSIX_PFX_PASSWORD -AsPlainText -Force
          $certificate = Get-PfxCertificate -FilePath $pfxPath -Password $password
          [System.IO.File]::WriteAllBytes($certificatePath, $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $publisher = $certificate.Subject
          "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "certificate_path=$certificatePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "publisher=$publisher" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stage MSIX package contents
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          .\packaging\windows\scripts\stage-msix-content.ps1 `
            -X64BinaryPath target\windows-msix\input\x64\cnb-rs.exe `
            -Arm64BinaryPath target\windows-msix\input\arm64\cnb-rs.exe `
            -OutputDir target\windows-msix\appxcontent `
            -IdentityName "${{ steps.metadata.outputs.identity_name }}" `
            -Publisher "${{ steps.certificate.outputs.publisher }}" `
            -PublisherDisplayName "${{ steps.metadata.outputs.publisher_display_name }}" `
            -DisplayName "${{ steps.metadata.outputs.display_name }}" `
            -Description "${{ steps.metadata.outputs.description }}" `
            -ExecutionAlias "${{ steps.metadata.outputs.execution_alias }}"

      - name: Build Windows MSIX/MSIXBUNDLE artifacts
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          .\packaging\windows\scripts\build-msixbundle.ps1 `
            -OutputDir target\windows-msix\output `
            -PfxPath "${{ steps.certificate.outputs.pfx_path }}" `
            -CertificatePath "${{ steps.certificate.outputs.certificate_path }}" `
            -Version "${{ steps.metadata.outputs.release_version }}"

      - name: Upload MSIX bundle artifact
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: cnb-rs-v${{ steps.metadata.outputs.release_version }}-windows-msvc.msixbundle
          path: target/windows-msix/output/cnb-rs-v${{ steps.metadata.outputs.release_version }}-windows-msvc.msixbundle
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows MSIX signing certificate artifact
        if: ${{ steps.signing_mode.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: cnb-rs-v${{ steps.metadata.outputs.release_version }}-windows-msvc-signing-cert.cer
          path: ${{ steps.certificate.outputs.certificate_path }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  smoke-test-msix:
    name: Smoke test Windows MSIX (${{ matrix.target }})
    needs: build-msix
    if: ${{ needs.build-msix.result == 'success' && needs.build-msix.outputs.msix_enabled == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Download MSIX bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: cnb-rs-v${{ needs.build-msix.outputs.release_version }}-windows-msvc.msixbundle
          path: target/windows-msix/download/bundle

      - name: Download MSIX signing certificate artifact
        uses: actions/download-artifact@v7
        with:
          name: cnb-rs-v${{ needs.build-msix.outputs.release_version }}-windows-msvc-signing-cert.cer
          path: target/windows-msix/download/cert

      - name: Smoke test MSIX install and uninstall
        shell: pwsh
        run: |
          $bundlePath = Get-ChildItem target\windows-msix\download\bundle\*.msixbundle | Select-Object -First 1 -ExpandProperty FullName
          $certificatePath = Get-ChildItem target\windows-msix\download\cert\*.cer | Select-Object -First 1 -ExpandProperty FullName
          .\packaging\windows\scripts\test-msixbundle.ps1 `
            -BundlePath $bundlePath `
            -CertificatePath $certificatePath `
            -ExpectedVersion "${{ needs.build-msix.outputs.msix_version }}"

  publish:
    name: Publish to CNB Release
    needs:
      - build
      - build-msix
      - smoke-test-msix
    if: ${{ always() && !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .
          git fetch --tags --force

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs-*
          path: release-artifacts
          merge-multiple: true

      - name: Ensure at least one artifact is available
        run: |
          set -euo pipefail

          if ! find release-artifacts -maxdepth 1 -type f | grep -q .; then
            echo "No successful build artifacts were produced; skip release publishing." >&2
            exit 1
          fi

      - name: Stage installer scripts
        run: |
          set -euo pipefail

          release_tag="${{ inputs.version }}"
          cp scripts/install.sh "release-artifacts/cnb-rs-${release_tag}-install.sh"
          cp scripts/install.ps1 "release-artifacts/cnb-rs-${release_tag}-install.ps1"
          chmod 755 "release-artifacts/cnb-rs-${release_tag}-install.sh"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail

          cd release-artifacts
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' -o -name '*.msix' -o -name '*.msixbundle' -o -name '*.deb' -o -name '*.rpm' -o -name '*.cer' -o -name 'cnb-rs-*-install.sh' -o -name 'cnb-rs-*-install.ps1' \) -printf '%P\n' | sort | xargs sha256sum > sha256sum.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v6
        with:
          name: cnb-rs-sha256sum
          path: release-artifacts/sha256sum.txt
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          set -euo pipefail
          git cliff --latest --strip header -o LATEST_CHANGELOG.md

      # ── GitHub Release（注释：等代码同步到 GitHub 后启用）────────────
      # - name: Create or update GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: ${{ inputs.version }}
      #     files: release-artifacts/*
      #     body_path: LATEST_CHANGELOG.md
      #     overwrite_files: true
      #     prerelease: ${{ contains(inputs.version, '-alpha') || contains(inputs.version, '-beta') }}

      - name: Setup cnb-rs
        uses: wwvl/setup-cnb-rs@main

      # ── CNB Release: create + upload ────────────────────────────────
      - name: Ensure CNB release exists
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -eu

          release_tag="${{ inputs.version }}"
          repo="${CNB_REPO_SLUG}"

          if cnb-rs --repo "${repo}" release view "${release_tag}" >/dev/null 2>&1; then
            echo "release ${release_tag} 已存在，跳过 create"
          else
            echo "release ${release_tag} 不存在，尝试创建"
            cnb-rs --repo "${repo}" release create \
              -t "${release_tag}" \
              -n "${release_tag}" \
              -F LATEST_CHANGELOG.md \
              -p \
              || echo "(create 报错，继续二次 view 验证)"

            if cnb-rs --repo "${repo}" release view "${release_tag}" >/dev/null 2>&1; then
              echo "二次验证：release ${release_tag} 已成功创建"
            else
              echo "ERROR: release ${release_tag} 仍不存在" >&2
              exit 1
            fi
          fi

      - name: Upload artifacts to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          release_tag="${{ inputs.version }}"
          repo="${CNB_REPO_SLUG}"

          cnb-rs --repo "${repo}" release upload -t "${release_tag}" --clobber release-artifacts/

          echo "CNB Release upload complete"

  publish-npm:
    name: Publish npm packages
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs-*
          path: release-artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # Strip leading 'v' from tag
          version="${{ inputs.version }}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Prerelease versions (containing '-') get published under 'next' tag
          if [[ "${version}" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish platform-specific packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          publish_platform() {
            local node_os="$1" node_arch="$2" rust_target="$3" binary_name="$4"
            local pkg_dir="npm-staging/${node_os}-${node_arch}"

            # Locate the release archive for this target
            local archive_file
            archive_file=$(find release-artifacts -maxdepth 1 -type f \( -name "cnb-rs-*-${rust_target}.tar.gz" -o -name "cnb-rs-*-${rust_target}.zip" \) | head -n 1)
            if [[ -z "${archive_file}" ]]; then
              echo "WARN: no artifact for ${rust_target}, skipping @cnb-rs/cli-${node_os}-${node_arch}"
              return 0
            fi

            mkdir -p "${pkg_dir}/bin"

            # Extract binary from archive
            if [[ "${archive_file}" == *.tar.gz ]]; then
              tar xzf "${archive_file}" --strip-components=1 -C "${pkg_dir}/bin" --wildcards "*/${binary_name}"
            elif [[ "${archive_file}" == *.zip ]]; then
              local tmpdir
              tmpdir=$(mktemp -d)
              unzip -q "${archive_file}" -d "${tmpdir}"
              cp "${tmpdir}"/*/"${binary_name}" "${pkg_dir}/bin/"
              rm -rf "${tmpdir}"
            fi

            chmod +x "${pkg_dir}/bin/${binary_name}"

            # Generate package.json from template (only substitute known variables)
            export node_os node_arch version
            envsubst '$node_os $node_arch $version' < npm/package.json.tmpl > "${pkg_dir}/package.json"
            cp npm/README.md "${pkg_dir}/"

            local pkg_full_name="@cnb-rs/cli-${node_os}-${node_arch}"
            local npm_tag="${{ steps.version.outputs.npm_tag }}"

            # Skip if this exact version is already published
            if npm view "${pkg_full_name}@${version}" version &>/dev/null; then
              echo "SKIP: ${pkg_full_name}@${version} already published"
              return 0
            fi

            echo "Publishing ${pkg_full_name}@${version} (tag: ${npm_tag})..."
            cd "${pkg_dir}"
            npm publish --access public --tag "${npm_tag}"
            cd - > /dev/null
          }

          publish_platform linux   x64   x86_64-unknown-linux-musl  cnb-rs
          publish_platform linux   arm64 aarch64-unknown-linux-musl cnb-rs
          publish_platform darwin  x64   x86_64-apple-darwin        cnb-rs
          publish_platform darwin  arm64 aarch64-apple-darwin       cnb-rs
          publish_platform win32   x64   x86_64-pc-windows-msvc    cnb-rs.exe
          publish_platform win32   arm64 aarch64-pc-windows-msvc   cnb-rs.exe

      - name: Publish base package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # Copy README into base package directory (npm includes root README automatically)
          cp npm/README.md npm/cnb-rs/README.md

          cd npm/cnb-rs

          # Replace placeholder version with actual version
          sed -i "s/0.0.0-placeholder/${version}/g" package.json

          npm_tag="${{ steps.version.outputs.npm_tag }}"

          # Skip if this exact version is already published
          if npm view "@cnb-rs/cli@${version}" version &>/dev/null; then
            echo "SKIP: @cnb-rs/cli@${version} already published"
            exit 0
          fi

          echo "Publishing @cnb-rs/cli@${version} (tag: ${npm_tag})..."
          npm publish --access public --tag "${npm_tag}"

  build-pypi-wheels:
    name: Build PyPI wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_17'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: '2_17'
            zig: true
          # Linux Musl (x86_64 only; aarch64-musl requires libdbus cross-build not available in musllinux container)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist --compatibility pypi ${{ matrix.zig && '--zig' || '' }}
          working-directory: pypi

      - name: Test wheel
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          pip install pypi/dist/cnb_rs-*.whl --force-reinstall
          cnb-rs --help
          python -m cnb_rs --help

      - name: Test wheel (musl)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c "
            apk add python3 py3-pip;
            pip install --break-system-packages pypi/dist/cnb_rs-*.whl --force-reinstall;
            cnb-rs --help;
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: pypi/dist/*.whl
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  build-pypi-sdist:
    name: Build PyPI sdist
    runs-on: ubuntu-latest
    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: pypi

      - name: Test sdist
        run: |
          pip install pypi/dist/cnb_rs-*.tar.gz --force-reinstall
          cnb-rs --help
          python -m cnb_rs --help

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: pypi-sdist
          path: pypi/dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish-pypi:
    name: Publish to PyPI
    needs: [build-pypi-wheels, build-pypi-sdist]
    if: ${{ needs.build-pypi-wheels.result == 'success' && needs.build-pypi-sdist.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: pypi-wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: pypi-sdist
          path: dist

      - name: Publish to PyPI
        run: uv publish -v dist/*

  update-setup-action:
    name: Update setup-cnb-rs default version
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Clone setup-cnb-rs from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/wwvo/cnb-rs/setup-cnb-rs.git" setup-cnb-rs
          cd setup-cnb-rs
          git config user.name "illegal_name_cnb.by9cbmyhqda"
          git config user.email "NSC0TbC7oYPediWNVyWWaC+illegal_name_cnb.by9cbmyhqda@noreply.cnb.cool"

      - name: Update default version
        run: |
          set -euo pipefail
          new_version="${{ inputs.version }}"
          cd setup-cnb-rs

          # Read current default version from action.yml
          old_version="$(grep -oP 'default: "v\K[^"]+' action.yml)"
          old_version="v${old_version}"

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "setup-cnb-rs already at ${new_version}, skipping"
            exit 0
          fi

          echo "Updating setup-cnb-rs: ${old_version} → ${new_version}"

          # Replace all occurrences of old version with new version
          sed -i "s|${old_version}|${new_version}|g" action.yml README.md README.en.md

          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "🔧 chore: bump default version to ${new_version}"
          git push

  update-package-repos:
    name: Update Homebrew and Scoop package repos
    needs: [publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs-*
          path: release-artifacts
          merge-multiple: true

      - name: Locate checksums file
        id: checksums
        run: |
          set -euo pipefail
          checksums_file="$(find release-artifacts -maxdepth 1 -name 'sha256sum.txt' -type f | head -n 1)"
          if [[ -z "${checksums_file}" ]]; then
            echo "::error::sha256sum.txt not found in release-artifacts"
            exit 1
          fi
          echo "file=${checksums_file}" >> "$GITHUB_OUTPUT"

      - name: Update package repositories
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_WEB_ENDPOINT: https://cnb.cool
        run: |
          set -euo pipefail
          python3 scripts/release/update_package_repos.py \
            --release-tag "${{ inputs.version }}" \
            --asset-source cnb \
            --checksums-file "${{ steps.checksums.outputs.file }}" \
            --push
