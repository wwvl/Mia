name: Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: '留空自动取最新 tag；或手动指定（如 v1.0.0-beta.1）'
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CNB_REPO_SLUG: wwvo/cnb-rs/cnb-rs
  CNB_GIT_USER_NAME: "illegal_name_cnb.by9cbmyhqda"
  CNB_GIT_USER_EMAIL: "wwvo@outlook.it"

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Detect release version
        id: resolve
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # versionsort.suffix=-：让 v1.0.0-rc.2 这类预发布 tag 排在 v1.0.0 之前，
            # 否则 git 默认把带后缀的 tag 视为更新版本，正式版发布后留空会错选回 rc。
            latest=$(git -c versionsort.suffix=- ls-remote --tags --sort=-version:refname \
              "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" "v*" \
              | grep -v '\^{}' | head -1 | sed 's|.*/||')
            if [[ -z "${latest}" ]]; then
              echo "ERROR: no tags found" >&2
              exit 1
            fi
            echo "version=${latest}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat "$GITHUB_OUTPUT" | grep version | cut -d= -f2)"

      - name: Verify tag matches Cargo.toml
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git init --quiet tag-check
          git -C tag-check remote add origin "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git"
          git -C tag-check fetch --quiet --depth=1 origin "refs/tags/${VERSION}"
          workspace_version="$(
            git -C tag-check show FETCH_HEAD:Cargo.toml |
              sed -n '/^\[workspace\.package\][[:space:]]*$/,/^\[/ {
                s/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p
              }'
          )"
          tag_version="${VERSION#v}"
          if [[ -z "${workspace_version}" || "${tag_version}" != "${workspace_version}" ]]; then
            echo "ERROR: release tag and Cargo.toml version do not match" >&2
            echo "Tag version: ${tag_version}" >&2
            echo "Cargo.toml workspace version: ${workspace_version:-<unreadable>}" >&2
            exit 1
          fi
          echo "Version verified: ${VERSION} -> ${workspace_version}"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            use_build_std: true
            toolchain: nightly
            package_linux_deb: true
            package_linux_rpm: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            setup_cross_toolchain: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            setup_cross_toolchain: true
            package_linux_deb: true
            package_linux_rpm: true
            linux_deb_arch: arm64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            setup_cross_toolchain: true
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            archive_ext: zip
            setup_mingw: true
            package_windows_msi: true
            windows_msi_arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            msvc_dev_cmd_arch: amd64
            package_windows_msi: true
            windows_msi_arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            msvc_dev_cmd_arch: amd64_arm64
            package_windows_msi: true
            windows_msi_arch: arm64
          - os: ubuntu-latest
            target: aarch64-pc-windows-gnullvm
            archive_ext: zip
            setup_cross_toolchain: true
            experimental: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.resolve.outputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || 'stable' }}
          targets: ${{ matrix.target }}
          components: ${{ matrix.use_build_std && 'rust-src' || '' }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: prerelease-${{ matrix.target }}

      - name: Resolve Cargo host target
        id: host_target
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          echo "target=${host_target}" >> "$GITHUB_OUTPUT"

      - name: Setup MinGW
        if: matrix.setup_mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain

      - name: Add MinGW to PATH
        if: matrix.setup_mingw
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Setup Windows ARM64 gnullvm toolchain
        if: matrix.setup_cross_toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Setup MSVC developer command prompt
        if: matrix.msvc_dev_cmd_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_dev_cmd_arch }}

      - name: Install Linux native packaging dependencies
        if: matrix.package_linux_deb || matrix.package_linux_rpm
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
          if [[ -n "${{ matrix.linux_deb_arch }}" ]]; then
            sudo apt-get install -y "crossbuild-essential-${{ matrix.linux_deb_arch }}"
          fi

      - name: Install cargo-deb
        if: matrix.package_linux_deb
        shell: bash
        run: cargo install cargo-deb --locked --target "${{ steps.host_target.outputs.target }}"

      - name: Install cargo-generate-rpm
        if: matrix.package_linux_rpm
        shell: bash
        run: cargo install cargo-generate-rpm --locked --target "${{ steps.host_target.outputs.target }}"

      - name: Setup .NET SDK
        if: matrix.package_windows_msi
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && !matrix.setup_cross_toolchain
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build binaries (Windows MSVC)
        if: endsWith(matrix.target, '-pc-windows-msvc')
        shell: pwsh
        run: cargo build --release --locked --target "${{ matrix.target }}" -p cnb-rs -p cnb-mcp

      - name: Build binaries (native)
        if: ${{ !endsWith(matrix.target, '-pc-windows-msvc') && !matrix.setup_cross_toolchain }}
        shell: bash
        run: |
          CARGO_CMD="cargo"
          BUILD_STD_FLAG=""
          if [[ "${{ matrix.use_build_std }}" == "true" ]]; then
            CARGO_CMD="cargo +nightly"
            BUILD_STD_FLAG="-Z build-std=std,panic_abort"
          fi
          $CARGO_CMD build --release --locked --target "${{ matrix.target }}" -p cnb-rs -p cnb-mcp $BUILD_STD_FLAG

      - name: Build binaries (cross-toolchain)
        if: matrix.setup_cross_toolchain
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}" -p cnb-rs -p cnb-mcp

      - name: Build Windows MSI package
        if: matrix.package_windows_msi
        shell: pwsh
        run: |
          .\scripts\packaging\windows\scripts\build-msi.ps1 `
            -Target ${{ matrix.target }} `
            -Architecture ${{ matrix.windows_msi_arch }} `
            -AssetVersion "${{ needs.resolve.outputs.version }}" `
            -OutputDir target\windows-msi

      - name: Build Linux packaging helper binary
        if: matrix.package_linux_deb || matrix.package_linux_rpm
        shell: bash
        run: |
          set -euo pipefail
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${{ matrix.target }}" == "${host_target}" ]]; then
            exit 0
          fi
          cargo build --release --locked --bin cnb-rs --target "${host_target}" --target-dir target/packaging-host

      - name: Compress binary with UPX (Linux only)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v upx &>/dev/null; then
            UPX_VERSION="5.1.1"
            curl -sL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" | tar -xJ --strip-components=1 -C /usr/local/bin "upx-${UPX_VERSION}-amd64_linux/upx"
          fi
          for bin in cnb-rs cnb-rs-mcp; do
            binary="target/${{ matrix.target }}/release/${bin}"
            if [[ -f "${binary}" ]]; then
              upx --best "${binary}" || echo "UPX compression failed for ${bin}, continuing with uncompressed binary"
            fi
          done

      - name: Package artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ needs.resolve.outputs.version }}"
          asset_base="cnb-rs-${release_tag}-${{ matrix.target }}"
          asset_dir="${asset_base}"
          archive_file=""
          msi_file=""
          deb_file=""
          rpm_file=""

          # Copy all workspace binaries into a single archive directory
          mkdir -p "${asset_dir}"
          for bin in cnb-rs cnb-rs-mcp; do
            if [[ "${{ matrix.target }}" == *-windows-* ]]; then
              bin_file="${bin}.exe"
            else
              bin_file="${bin}"
            fi
            bin_path="target/${{ matrix.target }}/release/${bin_file}"
            if [[ -f "${bin_path}" ]]; then
              cp "${bin_path}" "${asset_dir}/"
            fi
          done

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            7z a -tzip -mx=9 "${asset_base}.zip" "${asset_dir}"
            archive_file="${asset_base}.zip"
          else
            archive_file="${asset_base}.tar.gz"
            tar cf - "${asset_dir}" | gzip -9 > "${archive_file}"
          fi

          if [[ "${{ matrix.package_windows_msi }}" == "true" ]]; then
            generated_msi_file="$(find target/windows-msi -maxdepth 1 -type f -name "*-${{ matrix.target }}.msi" | sort | head -n 1)"
            : "${generated_msi_file:?failed to locate generated MSI file}"
            cp "${generated_msi_file}" .
            msi_file="$(basename "${generated_msi_file}")"
          fi

          if [[ "${{ matrix.package_linux_deb }}" == "true" || "${{ matrix.package_linux_rpm }}" == "true" ]]; then
            host_target="$(rustc -vV | sed -n 's/^host: //p')"
            completion_binary_path="target/${{ matrix.target }}/release/cnb-rs"
            if [[ "${{ matrix.target }}" != "${host_target}" ]]; then
              completion_binary_path="target/packaging-host/${host_target}/release/cnb-rs"
            fi
            bash scripts/packaging/linux/scripts/generate-completions.sh --binary-path "${completion_binary_path}"
          fi

          if [[ "${{ matrix.package_linux_deb }}" == "true" ]]; then
            cargo deb -p cnb-rs --no-build --no-strip --target "${{ matrix.target }}"
            generated_deb_file=""
            for candidate_dir in "target/${{ matrix.target }}/debian" "target/debian"; do
              if [[ -d "${candidate_dir}" ]]; then
                generated_deb_file="$(find "${candidate_dir}" -maxdepth 1 -type f -name '*.deb' | head -n 1)"
              fi
              if [[ -n "${generated_deb_file}" ]]; then break; fi
            done
            : "${generated_deb_file:?failed to locate generated deb file}"
            cp "${generated_deb_file}" .
            deb_file="$(basename "${generated_deb_file}")"
          fi

          if [[ "${{ matrix.package_linux_rpm }}" == "true" ]]; then
            # RPM Version field does not support '-'; convert to tilde for prerelease sorting
            # e.g., 1.0.0-beta.10 → 1.0.0~beta.10 (sorts lower than 1.0.0 in RPM)
            rpm_version="${release_tag//-/\~}"
            cargo generate-rpm -p crates/cnb-rs --target "${{ matrix.target }}" -s "version = \"${rpm_version}\""
            generated_rpm_file=""
            for candidate_dir in "target/${{ matrix.target }}/generate-rpm" "target/generate-rpm"; do
              if [[ -d "${candidate_dir}" ]]; then
                generated_rpm_file="$(find "${candidate_dir}" -maxdepth 1 -type f -name '*.rpm' | head -n 1)"
              fi
              if [[ -n "${generated_rpm_file}" ]]; then break; fi
            done
            : "${generated_rpm_file:?failed to locate generated rpm file}"
            cp "${generated_rpm_file}" .
            rpm_file="$(basename "${generated_rpm_file}")"
          fi

          printf 'archive_file=%s\n' "${archive_file}" >> "$GITHUB_OUTPUT"
          printf 'msi_file=%s\n' "${msi_file}" >> "$GITHUB_OUTPUT"
          printf 'deb_file=%s\n' "${deb_file}" >> "$GITHUB_OUTPUT"
          printf 'rpm_file=%s\n' "${rpm_file}" >> "$GITHUB_OUTPUT"

      - name: Upload build archive artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.archive_file }}
          path: ${{ steps.package.outputs.archive_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows MSI artifact
        if: ${{ steps.package.outputs.msi_file != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.msi_file }}
          path: ${{ steps.package.outputs.msi_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux DEB artifact
        if: ${{ steps.package.outputs.deb_file != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.deb_file }}
          path: ${{ steps.package.outputs.deb_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux RPM artifact
        if: ${{ steps.package.outputs.rpm_file != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.rpm_file }}
          path: ${{ steps.package.outputs.rpm_file }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish to CNB Release
    needs:
      - resolve
      - build
    if: ${{ always() && !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch "${{ needs.resolve.outputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .
          git fetch --tags --force

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs*
          path: release-artifacts
          merge-multiple: true

      - name: Ensure at least one artifact is available
        run: |
          set -euo pipefail

          if ! find release-artifacts -maxdepth 1 -type f | grep -q .; then
            echo "No successful build artifacts were produced; skip release publishing." >&2
            exit 1
          fi

      - name: Stage installer scripts
        run: |
          set -euo pipefail

          release_tag="${{ needs.resolve.outputs.version }}"
          cp scripts/install.sh "release-artifacts/cnb-rs-${release_tag}-install.sh"
          cp scripts/install.ps1 "release-artifacts/cnb-rs-${release_tag}-install.ps1"
          chmod 755 "release-artifacts/cnb-rs-${release_tag}-install.sh"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail

          cd release-artifacts
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name 'cnb-rs-*-install.sh' -o -name 'cnb-rs-*-install.ps1' \) -printf '%P\n' | sort | xargs sha256sum > sha256sum.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v6
        with:
          name: cnb-rs-sha256sum
          path: release-artifacts/sha256sum.txt
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          set -euo pipefail
          git cliff --latest --strip header -o LATEST_CHANGELOG.md

      # ── GitHub Release（注释：等代码同步到 GitHub 后启用）────────────
      # - name: Create or update GitHub Release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     tag_name: ${{ needs.resolve.outputs.version }}
      #     files: release-artifacts/*
      #     body_path: LATEST_CHANGELOG.md
      #     overwrite_files: true
      #     prerelease: ${{ contains(needs.resolve.outputs.version, '-') }}

      - name: Setup cnb-rs
        uses: wwvl/setup-cnb-rs@main

      # ── CNB Release: create + upload ────────────────────────────────
      - name: Ensure CNB release exists
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -eu

          release_tag="${{ needs.resolve.outputs.version }}"
          repo="${CNB_REPO_SLUG}"

          if cnb-rs --repo "${repo}" release view "${release_tag}" >/dev/null 2>&1; then
            echo "release ${release_tag} 已存在，跳过 create"
          else
            echo "release ${release_tag} 不存在，尝试创建"
            # 版本号含 '-'（alpha / beta / rc）→ 预发布；否则正式版并标记为 latest。
            # cnb-rs release edit 只能把 release 改成预发布、改不回来，所以必须在 create 时定对。
            if [[ "${release_tag}" == *-* ]]; then
              release_flags=(-p)
            else
              release_flags=(--make-latest)
            fi
            cnb-rs --repo "${repo}" release create \
              -t "${release_tag}" \
              -n "${release_tag}" \
              -F LATEST_CHANGELOG.md \
              "${release_flags[@]}" \
              || echo "(create 报错，继续二次 view 验证)"

            if cnb-rs --repo "${repo}" release view "${release_tag}" >/dev/null 2>&1; then
              echo "二次验证：release ${release_tag} 已成功创建"
            else
              echo "ERROR: release ${release_tag} 仍不存在" >&2
              exit 1
            fi
          fi

      - name: Upload artifacts to CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail

          release_tag="${{ needs.resolve.outputs.version }}"
          repo="${CNB_REPO_SLUG}"

          cnb-rs --repo "${repo}" release upload -t "${release_tag}" --clobber -c 1 release-artifacts/

          echo "CNB Release upload complete"

      # 给本次解决的 issue 留「已随 vX 发布」评论（commit footer Closes/Fixes/Resolves #n），
      # 替代按版本号命名的 released:* 标签；脚本幂等，rerun 不会重复评论。评论失败不影响发布本身。
      - name: Comment on resolved issues
        continue-on-error: true
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.version }}
          REPO: ${{ env.CNB_REPO_SLUG }}
        run: bash scripts/release/comment-resolved-issues.sh

  publish-npm:
    name: Publish npm packages
    needs: [resolve, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.resolve.outputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs-*
          path: release-artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # Strip leading 'v' from tag
          version="${{ needs.resolve.outputs.version }}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Prerelease versions (containing '-') get published under 'next' tag
          if [[ "${version}" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish platform-specific packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          publish_platform() {
            local node_os="$1" node_arch="$2" rust_target="$3" binary_name="$4"
            local pkg_dir="npm-staging/${node_os}-${node_arch}"

            # Locate the release archive for this target
            local archive_file
            archive_file=$(find release-artifacts -maxdepth 1 -type f \( -name "cnb-rs-*-${rust_target}.tar.gz" -o -name "cnb-rs-*-${rust_target}.zip" \) | head -n 1)
            if [[ -z "${archive_file}" ]]; then
              echo "WARN: no artifact for ${rust_target}, skipping @cnb-rs/cli-${node_os}-${node_arch}"
              return 0
            fi

            mkdir -p "${pkg_dir}/bin"

            # Extract binary from archive
            if [[ "${archive_file}" == *.tar.gz ]]; then
              tar xzf "${archive_file}" --strip-components=1 -C "${pkg_dir}/bin" --wildcards "*/${binary_name}"
            elif [[ "${archive_file}" == *.zip ]]; then
              local tmpdir
              tmpdir=$(mktemp -d)
              unzip -q "${archive_file}" -d "${tmpdir}"
              cp "${tmpdir}"/*/"${binary_name}" "${pkg_dir}/bin/"
              rm -rf "${tmpdir}"
            fi

            chmod +x "${pkg_dir}/bin/${binary_name}"

            # Generate package.json from template (only substitute known variables)
            export node_os node_arch version
            envsubst '$node_os $node_arch $version' < npm/package.json.tmpl > "${pkg_dir}/package.json"
            cp npm/README.md "${pkg_dir}/"

            local pkg_full_name="@cnb-rs/cli-${node_os}-${node_arch}"
            local npm_tag="${{ steps.version.outputs.npm_tag }}"

            # Skip if this exact version is already published
            if npm view "${pkg_full_name}@${version}" version &>/dev/null; then
              echo "SKIP: ${pkg_full_name}@${version} already published"
              return 0
            fi

            echo "Publishing ${pkg_full_name}@${version} (tag: ${npm_tag})..."
            cd "${pkg_dir}"
            npm publish --access public --tag "${npm_tag}"
            cd - > /dev/null
          }

          publish_platform linux   x64   x86_64-unknown-linux-musl  cnb-rs
          publish_platform linux   arm64 aarch64-unknown-linux-musl cnb-rs
          publish_platform darwin  x64   x86_64-apple-darwin        cnb-rs
          publish_platform darwin  arm64 aarch64-apple-darwin       cnb-rs
          publish_platform win32   x64   x86_64-pc-windows-msvc    cnb-rs.exe
          publish_platform win32   arm64 aarch64-pc-windows-msvc   cnb-rs.exe

      - name: Publish base package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          # Copy README into base package directory (npm includes root README automatically)
          cp npm/README.md npm/cnb-rs/README.md

          cd npm/cnb-rs

          # Replace placeholder version with actual version
          sed -i "s/0.0.0-placeholder/${version}/g" package.json

          npm_tag="${{ steps.version.outputs.npm_tag }}"

          # Skip if this exact version is already published
          if npm view "@cnb-rs/cli@${version}" version &>/dev/null; then
            echo "SKIP: @cnb-rs/cli@${version} already published"
            exit 0
          fi

          echo "Publishing @cnb-rs/cli@${version} (tag: ${npm_tag})..."
          npm publish --access public --tag "${npm_tag}"

      - name: Publish MCP platform-specific packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          publish_mcp_platform() {
            local node_os="$1" node_arch="$2" rust_target="$3" binary_name="$4"
            local pkg_dir="npm-staging/mcp-${node_os}-${node_arch}"

            local archive_file
            archive_file=$(find release-artifacts -maxdepth 1 -type f \( -name "cnb-rs-*-${rust_target}.tar.gz" -o -name "cnb-rs-*-${rust_target}.zip" \) | head -n 1)
            if [[ -z "${archive_file}" ]]; then
              echo "WARN: no artifact for ${rust_target}, skipping @cnb-rs/mcp-${node_os}-${node_arch}"
              return 0
            fi

            mkdir -p "${pkg_dir}/bin"

            if [[ "${archive_file}" == *.tar.gz ]]; then
              tar xzf "${archive_file}" --strip-components=1 -C "${pkg_dir}/bin" --wildcards "*/${binary_name}"
            elif [[ "${archive_file}" == *.zip ]]; then
              local tmpdir
              tmpdir=$(mktemp -d)
              unzip -q "${archive_file}" -d "${tmpdir}"
              cp "${tmpdir}"/*/"${binary_name}" "${pkg_dir}/bin/"
              rm -rf "${tmpdir}"
            fi

            chmod +x "${pkg_dir}/bin/${binary_name}"

            export node_os node_arch version
            envsubst '$node_os $node_arch $version' < npm/package.json.mcp.tmpl > "${pkg_dir}/package.json"
            cp npm/README.md "${pkg_dir}/"

            local pkg_full_name="@cnb-rs/mcp-${node_os}-${node_arch}"
            local npm_tag="${{ steps.version.outputs.npm_tag }}"

            if npm view "${pkg_full_name}@${version}" version &>/dev/null; then
              echo "SKIP: ${pkg_full_name}@${version} already published"
              return 0
            fi

            echo "Publishing ${pkg_full_name}@${version} (tag: ${npm_tag})..."
            cd "${pkg_dir}"
            npm publish --access public --tag "${npm_tag}"
            cd - > /dev/null
          }

          publish_mcp_platform linux   x64   x86_64-unknown-linux-musl  cnb-rs-mcp
          publish_mcp_platform linux   arm64 aarch64-unknown-linux-musl cnb-rs-mcp
          publish_mcp_platform darwin  x64   x86_64-apple-darwin        cnb-rs-mcp
          publish_mcp_platform darwin  arm64 aarch64-apple-darwin       cnb-rs-mcp
          publish_mcp_platform win32   x64   x86_64-pc-windows-msvc    cnb-rs-mcp.exe
          publish_mcp_platform win32   arm64 aarch64-pc-windows-msvc   cnb-rs-mcp.exe

      - name: Publish MCP base package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          cp npm/README.md npm/cnb-rs-mcp/README.md

          cd npm/cnb-rs-mcp

          sed -i "s/0.0.0-placeholder/${version}/g" package.json

          npm_tag="${{ steps.version.outputs.npm_tag }}"

          if npm view "@cnb-rs/mcp@${version}" version &>/dev/null; then
            echo "SKIP: @cnb-rs/mcp@${version} already published"
            exit 0
          fi

          echo "Publishing @cnb-rs/mcp@${version} (tag: ${npm_tag})..."
          npm publish --access public --tag "${npm_tag}"

  build-pypi-wheels:
    name: Build PyPI wheel (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GNU
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_17'
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: '2_17'
            zig: true
          # Linux Musl (x86_64 only; aarch64-musl requires libdbus cross-build not available in musllinux container)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.resolve.outputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../../dist --compatibility pypi ${{ matrix.zig && '--zig' || '' }}
          working-directory: pypi/cnb-rs

      - name: Build MCP wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../../dist --compatibility pypi ${{ matrix.zig && '--zig' || '' }}
          working-directory: pypi/cnb-rs-mcp

      - name: Test wheel
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          pip install dist/cnb_rs-*.whl --force-reinstall
          cnb-rs --help
          python -m cnb_rs --help
          pip install dist/cnb_rs_mcp-*.whl --force-reinstall
          cnb-rs-mcp --help
          cnb-rs-mcp --version
          python -m cnb_rs_mcp --help

      - name: Test wheel (musl)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c "
            apk add python3 py3-pip;
            pip install --break-system-packages dist/cnb_rs-*.whl --force-reinstall;
            cnb-rs --help;
            pip install --break-system-packages dist/cnb_rs_mcp-*.whl --force-reinstall;
            cnb-rs-mcp --help;
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  build-pypi-sdist:
    name: Build PyPI sdist
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Clone from CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.resolve.outputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: pypi/cnb-rs

      - name: Build MCP sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../../dist
          working-directory: pypi/cnb-rs-mcp

      - name: Test sdist
        run: |
          pip install dist/cnb_rs-*.tar.gz --force-reinstall
          cnb-rs --help
          python -m cnb_rs --help
          pip install dist/cnb_rs_mcp-*.tar.gz --force-reinstall
          cnb-rs-mcp --help
          cnb-rs-mcp --version
          python -m cnb_rs_mcp --help

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish-pypi:
    name: Publish to PyPI
    needs: [build-pypi-wheels, build-pypi-sdist]
    if: ${{ needs.build-pypi-wheels.result == 'success' && needs.build-pypi-sdist.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: pypi-wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: pypi-sdist
          path: dist

      - name: Publish to PyPI
        run: uv publish -v dist/*

  update-setup-action:
    name: Update setup-cnb-rs default version
    needs: [resolve, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Clone setup-cnb-rs from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/wwvo/cnb-rs/setup-cnb-rs.git" setup-cnb-rs
          cd setup-cnb-rs
          git config user.name "${CNB_GIT_USER_NAME}"
          git config user.email "${CNB_GIT_USER_EMAIL}"

      - name: Update default version
        run: |
          set -euo pipefail
          new_version="${{ needs.resolve.outputs.version }}"
          cd setup-cnb-rs

          # Read current default version from action.yml
          old_version="$(grep -oP 'default: "v\K[^"]+' action.yml)"
          old_version="v${old_version}"

          if [[ "${old_version}" == "${new_version}" ]]; then
            echo "setup-cnb-rs already at ${new_version}, skipping"
            exit 0
          fi

          echo "Updating setup-cnb-rs: ${old_version} → ${new_version}"

          # Replace all occurrences of old version with new version
          sed -i "s|${old_version}|${new_version}|g" action.yml README.md README.en.md

          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore(release): bump default version to ${new_version}"
          git push

  update-package-repos:
    name: Update Homebrew and Scoop package repos
    needs: [resolve, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ needs.resolve.outputs.version }}" \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs-*
          path: release-artifacts
          merge-multiple: true

      - name: Locate checksums file
        id: checksums
        run: |
          set -euo pipefail
          checksums_file="$(find release-artifacts -maxdepth 1 -name 'sha256sum.txt' -type f | head -n 1)"
          if [[ -z "${checksums_file}" ]]; then
            echo "::error::sha256sum.txt not found in release-artifacts"
            exit 1
          fi
          echo "file=${checksums_file}" >> "$GITHUB_OUTPUT"

      - name: Update package repositories
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_WEB_ENDPOINT: https://cnb.cool
        run: |
          set -euo pipefail
          python3 scripts/release/update_package_repos.py \
            --release-tag "${{ needs.resolve.outputs.version }}" \
            --asset-source cnb \
            --checksums-file "${{ steps.checksums.outputs.file }}" \
            --push

  trigger-plugin-image:
    name: Trigger plugin image build
    needs: [resolve, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Setup cnb-rs
        uses: wwvl/setup-cnb-rs@main

      - name: Trigger plugin image build on CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering plugin image build for ${{ needs.resolve.outputs.version }}..."
          cnb-rs build start --repo wwvo/cnb-rs/cnb-rs -b main -e api_trigger_build-plugin-image --title "构建插件镜像 (${{ needs.resolve.outputs.version }})"

  update-readme:
    name: Update README help output
    needs: [resolve, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Clone from CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          # 浅克隆只抓远端 HEAD 分支，显式 --branch main 固定分支，不依赖远端 HEAD 指向；
          # 切 release/<tag> 分支是从 main 分出来，不需要完整历史。
          git clone --depth 1 --branch main \
            "https://oauth2:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" repo
          cd repo
          git config user.name "${CNB_GIT_USER_NAME}"
          git config user.email "${CNB_GIT_USER_EMAIL}"

      - name: Download binary
        uses: actions/download-artifact@v7
        with:
          pattern: cnb-rs-*-x86_64-unknown-linux-musl*
          path: repo/artifacts
          merge-multiple: true

      - name: Extract binary
        id: extract
        working-directory: repo
        run: |
          set -euo pipefail
          archive=$(find artifacts -name "cnb-rs-*-x86_64-unknown-linux-musl.tar.gz" | head -1)
          if [[ -z "${archive}" ]]; then
            echo "No linux-musl archive found, skipping README update"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/cnb-bin
          tar xzf "${archive}" --strip-components=1 -C /tmp/cnb-bin
          chmod +x /tmp/cnb-bin/cnb-rs
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Setup cnb-rs
        if: ${{ steps.extract.outputs.found == 'true' }}
        uses: wwvl/setup-cnb-rs@main

      # main 是保护分支，直推会被 hook 拒绝；改为切 release/<tag> 分支提交并开 PR 等人工合入。
      - name: Sync README help output via PR
        if: ${{ steps.extract.outputs.found == 'true' }}
        working-directory: repo
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.version }}
          README_BIN: /tmp/cnb-bin/cnb-rs
          REPO: ${{ env.CNB_REPO_SLUG }}
        run: bash scripts/release/open-readme-pr.sh
